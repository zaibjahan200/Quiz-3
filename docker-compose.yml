version: "3.9"

services:
  aaj-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aaj_news_scraper
    ports:
      - "7000:7000"          # host:container
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}   # loaded from .env file
    restart: unless-stopped
    # Chrome in headless mode needs a bit more shared memory
    shm_size: "256mb"
